name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package
        run: pnpm check

      - name: Validate release metadata
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="earned-done-v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Expected release tag $expected_tag, got $RELEASE_TAG" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ "$RELEASE_SHA" != "$head_commit" ]]; then
            echo "Release tag must point to the default branch HEAD" >&2
            exit 1
          fi
          if [[ "$package_version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack the minimum-runtime artifact
        id: runtime_package
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tarball="$RUNNER_TEMP/toomean-skills-${package_version}.tgz"
          pnpm pack --pack-destination "$RUNNER_TEMP"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Set up the minimum Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Verify the packed CLI on the minimum runtime
        env:
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}/minimum-runtime/claude-skills
          CODEX_SKILLS_DIR: ${{ runner.temp }}/minimum-runtime/codex-skills
          TARBALL: ${{ steps.runtime_package.outputs.tarball }}
        run: |
          prefix="$RUNNER_TEMP/minimum-runtime/npm"
          npm install --ignore-scripts --prefix "$prefix" "$TARBALL"
          cli="$prefix/node_modules/.bin/toomean-skills"
          "$cli" list
          "$cli" install earned-done --provider all
          cmp earned-done/SKILL.md "$CLAUDE_SKILLS_DIR/earned-done/SKILL.md"
          cmp earned-done/SKILL.md "$CODEX_SKILLS_DIR/earned-done/SKILL.md"

      - name: Restore the publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - name: Publish package
        run: npm publish --access public --tag "${{ steps.release.outputs.dist_tag }}"
